<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Perkembangan Pemilih - Pilkades Kebondowo 2026</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-blue-800 text-white py-6 shadow-md">
        <div class="container mx-auto px-4">
            <h1 class="text-2xl md:text-3xl font-bold">Laporan Perkembangan Daftar Pemilih</h1>
            <p class="text-blue-200 mt-1">Pemilihan Kepala Desa Kebondowo Tahun 2026</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-purple-600">
                <p class="text-sm text-gray-500 font-semibold">TOTAL DPS</p>
                <p class="text-2xl font-bold text-gray-800">4.915</p>
                <p class="text-xs text-gray-500 mt-1">L: 2.296 | P: 2.619</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-red-600">
                <p class="text-sm text-gray-500 font-semibold">PEMILIH TMS</p>
                <p class="text-2xl font-bold text-red-600">2</p>
                <p class="text-xs text-gray-500 mt-1">L: 1 | P: 1</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-cyan-600">
                <p class="text-sm text-gray-500 font-semibold">PEMILIH BARU (TAMBAHAN)</p>
                <p class="text-2xl font-bold text-cyan-700">23</p>
                <p class="text-xs text-gray-500 mt-1">L: 11 | P: 12</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-amber-500">
                <p class="text-sm text-gray-500 font-semibold">TOTAL DPT AKHIR (11 TPS)</p>
                <p class="text-2xl font-bold text-amber-600">4.936</p>
                <p class="text-xs text-gray-500 mt-1">L: 2.306 | P: 2.630</p>
            </div>
        </div>

        <div class="flex flex-wrap border-b border-gray-300 mb-6 gap-2">
            <button onclick="switchTab('dpt')" id="tab-dpt" class="tab-btn px-5 py-3 font-semibold rounded-t-lg bg-blue-700 text-white">
                Daftar Pemilih Tetap (DPT - 11 TPS)
            </button>
            <button onclick="switchTab('tms')" id="tab-tms" class="tab-btn px-5 py-3 font-semibold rounded-t-lg bg-gray-200 text-gray-700 hover:bg-gray-300">
                Pemilih TMS (Data Lengkap)
            </button>
            <button onclick="switchTab('baru')" id="tab-baru" class="tab-btn px-5 py-3 font-semibold rounded-t-lg bg-gray-200 text-gray-700 hover:bg-gray-300">
                Pemilih Baru (Usulan Masyarakat)
            </button>
        </div>
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2">
                <label class="block text-xs font-semibold text-gray-600 mb-1">CARI NAMA PEMILIH</label>
                <input type="text" id="searchName" onkeyup="resetAndRender()" placeholder="Ketik nama pemilih..." 
                    class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-semibold text-gray-600 mb-1">FILTER ASAL / TUJUAN TPS</label>
                <select id="filterTps" onchange="resetAndRender()" 
                    class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Semua TPS (TPS 001 - TPS 011)</option>
                    <option value="TPS 001">TPS 001 - Dusun Jambon</option>
                    <option value="TPS 002">TPS 002 - Dusun Kauman RW 002</option>
                    <option value="TPS 003">TPS 003 - Dusun Kauman RW 003</option>
                    <option value="TPS 004">TPS 004 - Dusun Pundan RW 004</option>
                    <option value="TPS 005">TPS 005 - Dusun Pundan RW 005</option>
                    <option value="TPS 006">TPS 006 - Zipur & Pusdikbinmas</option>
                    <option value="TPS 007">TPS 007 - Dusun Kebonbawang</option>
                    <option value="TPS 008">TPS 008 - Dusun Kebondowo RW 009</option>
                    <option value="TPS 009">TPS 009 - Dusun Kebondowo RW 010</option>
                    <option value="TPS 010">TPS 010 - Dusun Jrakah</option>
                    <option value="TPS 011">TPS 011 - Dusun Kebonsari</option>
                </select>
            </div>
            <div class="w-full md:w-auto text-right self-end">
                <span id="resultCount" class="text-sm font-semibold text-gray-600">Memuat data...</span>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead id="tableHead" class="bg-gray-100 text-gray-700 uppercase text-xs font-bold"></thead>
                <tbody id="tableBody" class="divide-y divide-gray-200">
                    <tr><td colspan="9" class="text-center py-8 text-gray-500">Memuat data CSV...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="paginationControls" class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-lg shadow">
            <div class="text-sm text-gray-600" id="pageInfo">Halaman 1 dari 1</div>
            <div class="flex gap-2">
                <button onclick="changePage(-1)" id="btnPrev" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 disabled:opacity-50">&laquo; Sebelumnya</button>
                <button onclick="changePage(1)" id="btnNext" class="px-4 py-2 bg-blue-700 text-white rounded hover:bg-blue-800 disabled:opacity-50">Berikutnya &raquo;</button>
            </div>
        </div>
    </main>

    <script>
        let currentTab = 'dpt';
        let currentPage = 1;
        const rowsPerPage = 100;
        let datasets = { dpt: [], tms: [], baru: [] };

        const dptFiles = [
            { file: 'TPS 001.csv', tps: 'TPS 001' }, { file: 'TPS 002.csv', tps: 'TPS 002' },
            { file: 'TPS 003.csv', tps: 'TPS 003' }, { file: 'TPS 004.csv', tps: 'TPS 004' },
            { file: 'TPS 005.csv', tps: 'TPS 005' }, { file: 'TPS 006.csv', tps: 'TPS 006' },
            { file: 'TPS 007.csv', tps: 'TPS 007' }, { file: 'TPS 008.csv', tps: 'TPS 008' },
            { file: 'TPS 009.csv', tps: 'TPS 009' }, { file: 'TPS 010.csv', tps: 'TPS 010' },
            { file: 'TPS 011.csv', tps: 'TPS 011' }
        ];

        function parseCSV(filename) {
            return new Promise((resolve) => {
                Papa.parse(encodeURIComponent(filename), {
                    download: true, header: true, delimiter: ";", skipEmptyLines: true,
                    complete: (results) => resolve(results.data || []),
                    error: () => resolve([])
                });
            });
        }

        async function loadAllData() {
            const dptPromises = dptFiles.map(async (item) => {
                const rows = await parseCSV(item.file);
                return rows.map(row => ({ ...row, TPS: item.tps }));
            });
            datasets.dpt = (await Promise.all(dptPromises)).flat();
            datasets.tms = await parseCSV('data_tms.csv');
            datasets.baru = await parseCSV('data_baru.csv');
            renderTable();
        }
        function switchTab(tab) {
            currentTab = tab;
            currentPage = 1;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-700', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById(`tab-${tab}`).classList.remove('bg-gray-200', 'text-gray-700');
            document.getElementById(`tab-${tab}`).classList.add('bg-blue-700', 'text-white');
            renderTable();
        }

        function resetAndRender() { currentPage = 1; renderTable(); }

        function changePage(direction) {
            currentPage += direction;
            renderTable();
            window.scrollTo({ top: 250, behavior: 'smooth' });
        }

        function renderTable() {
            const searchQuery = document.getElementById('searchName').value.toLowerCase().trim();
            const tpsFilter = document.getElementById('filterTps').value;
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            const filtered = (datasets[currentTab] || []).filter(row => {
                const matchName = (row.Nama || '').toLowerCase().includes(searchQuery);
                const matchTps = tpsFilter === '' || (row.TPS || '').trim() === tpsFilter;
                return matchName && matchTps;
            });

            const totalRows = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalRows / rowsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * rowsPerPage;
            const paginatedData = filtered.slice(startIdx, startIdx + rowsPerPage);

            document.getElementById('resultCount').innerText = `Ditemukan ${totalRows.toLocaleString('id-ID')} pemilih`;
            document.getElementById('pageInfo').innerText = `Halaman ${currentPage} dari ${totalPages}`;
            document.getElementById('btnPrev').disabled = currentPage <= 1;
            document.getElementById('btnNext').disabled = currentPage >= totalPages;

            if (currentTab === 'tms') {
                tableHead.innerHTML = `<tr><th class="px-4 py-3 text-left">No</th><th class="px-4 py-3 text-left">NKK</th><th class="px-4 py-3 text-left">NIK</th><th class="px-4 py-3 text-left">Nama</th><th class="px-4 py-3 text-left">Jenis Kelamin</th><th class="px-4 py-3 text-left">Usia</th><th class="px-4 py-3 text-left">Alamat</th><th class="px-4 py-3 text-left">Asal TPS</th><th class="px-4 py-3 text-left">Keterangan</th></tr>`;
            } else if (currentTab === 'baru') {
                tableHead.innerHTML = `<tr><th class="px-4 py-3 text-left">No</th><th class="px-4 py-3 text-left">Nama</th><th class="px-4 py-3 text-left">Jenis Kelamin</th><th class="px-4 py-3 text-left">Umur</th><th class="px-4 py-3 text-left">Alamat</th><th class="px-4 py-3 text-left">TPS yang Dituju</th></tr>`;
            } else {
                tableHead.innerHTML = `<tr><th class="px-4 py-3 text-left">No</th><th class="px-4 py-3 text-left">ID Pemilih</th><th class="px-4 py-3 text-left">Nama</th><th class="px-4 py-3 text-left">Jenis Kelamin</th><th class="px-4 py-3 text-left">Usia</th><th class="px-4 py-3 text-left">Alamat</th><th class="px-4 py-3 text-left">Asal TPS</th></tr>`;
            }

            if (paginatedData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-500">Data tidak ditemukan atau file CSV belum diunggah.</td></tr>`;
                return;
            }

            tableBody.innerHTML = paginatedData.map((row, idx) => {
                const no = startIdx + idx + 1;
                if (currentTab === 'tms') {
                    return `<tr class="hover:bg-gray-50"><td class="px-4 py-3">${no}</td><td class="px-4 py-3 font-mono">${row.NKK || '-'}</td><td class="px-4 py-3 font-mono">${row.NIK || '-'}</td><td class="px-4 py-3 font-semibold">${row.Nama || '-'}</td><td class="px-4 py-3">${row.JnsKlmn || '-'}</td><td class="px-4 py-3">${row.Usia || '-'}</td><td class="px-4 py-3">${row.Alamat || '-'}</td><td class="px-4 py-3"><span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-semibold">${row.TPS || '-'}</span></td><td class="px-4 py-3">${row.Keterangan || '-'}</td></tr>`;
                } else if (currentTab === 'baru') {
                    return `<tr class="hover:bg-gray-50"><td class="px-4 py-3">${no}</td><td class="px-4 py-3 font-semibold">${row.Nama || '-'}</td><td class="px-4 py-3">${row.JnsKlmn || '-'}</td><td class="px-4 py-3">${row.Usia || '-'}</td><td class="px-4 py-3">${row.Alamat || '-'}</td><td class="px-4 py-3"><span class="bg-cyan-100 text-cyan-800 px-2 py-1 rounded text-xs font-semibold">${row.TPS || '-'}</span></td></tr>`;
                } else {
                    return `<tr class="hover:bg-gray-50"><td class="px-4 py-3">${no}</td><td class="px-4 py-3 font-mono text-gray-600">${row.ID || '-'}</td><td class="px-4 py-3 font-semibold">${row.Nama || '-'}</td><td class="px-4 py-3">${row.JnsKlmn || '-'}</td><td class="px-4 py-3">${row.Usia || '-'}</td><td class="px-4 py-3">${row.Alamat || '-'}</td><td class="px-4 py-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">${row.TPS || '-'}</span></td></tr>`;
                }
            }).join('');
        }

        loadAllData();
    </script>
</body>
</html>
